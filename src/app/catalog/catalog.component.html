<main class="catalog-page">
  <mat-toolbar color="primary" class="catalog-toolbar">
    <div class="toolbar-content">
      <div class="toolbar-title">
        <img *ngIf="showLogo" src="assets/company-logo.png" alt="Company logo" class="company-logo" (error)="logoLoadError()" />
        <span *ngIf="!showLogo">Catálogo del Supermercado</span>
      </div>
      <button
        mat-flat-button
        class="order-now-btn"
        (click)="openCart()"
        matTooltip="Ver carrito"
        [matBadge]="cartItemCount()"
        matBadgeColor="accent"
        [matBadgeHidden]="cartItemCount() === 0"
      >
        <span class="order-text">{{ cartItemCount() === 1 ? 'Producto' : 'Productos' }}</span>
        <mat-icon class="order-icon">shopping_cart</mat-icon>
      </button>
    </div>
  </mat-toolbar>

  <section class="catalog-header">
    <div class="search-row">
      <mat-form-field appearance="outline" class="search-field centered-search">
        <mat-label>Buscar producto</mat-label>
        <input
          matInput
          type="search"
          placeholder="Ej. pan, leche, huevos"
          (input)="searchTerm.set($any($event.target).value)"
        />
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
    </div>
  </section>

  <section class="product-grid">
    <article class="product-card empty-state" *ngIf="filteredProducts().length === 0">
      <mat-card>
        <p>No se encontraron productos para "{{ searchTerm() }}".</p>
      </mat-card>
    </article>
    <article class="product-card" *ngFor="let product of filteredProducts()">
      <mat-card>
        <div class="product-image" aria-hidden="true">
          <img *ngIf="product.imageUrl; else noProductImage" [src]="product.imageUrl" [alt]="product.name" />
          <ng-template #noProductImage>
            {{ product.name.charAt(0) }}
          </ng-template>
        </div>

        <mat-card-header>
          <mat-card-title>{{ product.name }}</mat-card-title>
          <mat-card-subtitle>{{ product.category }}</mat-card-subtitle>
        </mat-card-header>

        <mat-card-content>
          <div class="product-meta">
            <span class="product-price">$ {{ product.price | number:'1.0-0' }}</span>
            <div class="quantity-control">
              <button
                mat-mini-fab
                color="primary"
                type="button"
                aria-label="Restar cantidad"
                (click)="changeQuantity(product.id, -1)"
                [disabled]="getQuantity(product.id) === 1"
              >
                <mat-icon>remove</mat-icon>
              </button>
              <span class="quantity-value">{{ getQuantity(product.id) }}</span>
              <button
                mat-mini-fab
                color="primary"
                type="button"
                aria-label="Agregar cantidad"
                (click)="changeQuantity(product.id, 1)"
              >
                <mat-icon>add</mat-icon>
              </button>
            </div>
          </div>
        </mat-card-content>

        <mat-card-actions>
          <button mat-flat-button color="primary" (click)="addToCart(product)" [disabled]="!product.available">
            <mat-icon>shopping_cart</mat-icon>
            Agregar
          </button>
        </mat-card-actions>
      </mat-card>
    </article>
  </section>
  
</main>
